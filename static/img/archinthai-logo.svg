<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6f9b6d"/>
      <stop offset="100%" stop-color="#a7be8f"/>
    </linearGradient>
    <linearGradient id="aGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f1e8"/>
      <stop offset="100%" stop-color="#e7efe1"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle inner ring -->
  <rect x="52" y="52" width="408" height="408" rx="80" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Abstract "A" as a building / house form -->
  <!-- Left tower -->
  <rect x="150" y="210" width="46" height="150" rx="8" fill="url(#aGrad)"/>
  <!-- Right tower -->
  <rect x="316" y="210" width="46" height="150" rx="8" fill="url(#aGrad)"/>
  <!-- Crossbar / floor plates -->
  <rect x="150" y="258" width="212" height="14" rx="7" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="150" y="300" width="212" height="14" rx="7" fill="#ffffff" fill-opacity="0.9"/>
  <!-- Apex / roof -->
  <path d="M136 214 L256 138 L376 214 Z" fill="#f4f1e8"/>

  <!-- Windows on towers -->
  <g fill="#6f9b6d">
    <rect x="162" y="276" width="22" height="14" rx="4"/>
    <rect x="162" y="318" width="22" height="14" rx="4"/>
    <rect x="328" y="276" width="22" height="14" rx="4"/>
    <rect x="328" y="318" width="22" height="14" rx="4"/>
  </g>

  <!-- Ground line -->
  <rect x="120" y="360" width="272" height="8" rx="4" fill="#ffffff" fill-opacity="0.7"/>
</svg>
